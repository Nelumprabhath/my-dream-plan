<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dream Plan</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --card: #16213e;
      --accent: #e94560;
      --accent2: #0f3460;
      --accent3: #533483;
      --text: #eaeaea;
      --muted: #888;
      --border: #2a2a4a;
      --success: #4caf50;
      --warning: #ff9800;
      --info: #2196f3;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, var(--accent2), var(--accent3));
      padding: 2rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    header h1 {
      font-size: 2.5rem;
      font-weight: 700;
      position: relative;
    }
    header p {
      color: rgba(255,255,255,0.7);
      margin-top: 0.5rem;
      font-size: 1.05rem;
      position: relative;
    }
    .header-stats {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-top: 1.5rem;
      position: relative;
    }
    .stat {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 0.75rem 1.5rem;
      text-align: center;
    }
    .stat-num {
      font-size: 1.8rem;
      font-weight: 700;
      color: #fff;
    }
    .stat-label {
      font-size: 0.75rem;
      color: rgba(255,255,255,0.6);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* ── Nav Tabs ── */
    nav {
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      gap: 0.25rem;
    }
    nav button {
      background: none;
      border: none;
      color: var(--muted);
      padding: 1rem 1.5rem;
      cursor: pointer;
      font-size: 0.95rem;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    nav button:hover { color: var(--text); }
    nav button.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ── Layout ── */
    main { max-width: 1100px; margin: 0 auto; padding: 2rem; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* ── Add Dream Button ── */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .section-title {
      font-size: 1.4rem;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s;
    }
    .btn-primary:hover { opacity: 0.85; transform: translateY(-1px); }

    /* ── Filter Bar ── */
    .filter-bar {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }
    .filter-bar input,
    .filter-bar select {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.6rem 1rem;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .filter-bar input { flex: 1; min-width: 180px; }
    .filter-bar input:focus,
    .filter-bar select:focus { border-color: var(--accent); }

    /* ── Dream Cards ── */
    .dreams-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 1.25rem;
    }
    .dream-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      transition: transform 0.2s, box-shadow 0.2s;
      position: relative;
      overflow: hidden;
    }
    .dream-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      border-radius: 14px 14px 0 0;
    }
    .dream-card[data-status="not-started"]::before { background: var(--muted); }
    .dream-card[data-status="in-progress"]::before { background: var(--warning); }
    .dream-card[data-status="completed"]::before { background: var(--success); }
    .dream-card[data-status="on-hold"]::before { background: var(--info); }
    .dream-card:hover { transform: translateY(-3px); box-shadow: 0 8px 30px rgba(0,0,0,0.3); }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }
    .card-title { font-size: 1.1rem; font-weight: 600; flex: 1; padding-right: 0.5rem; }
    .card-actions { display: flex; gap: 0.4rem; }
    .icon-btn {
      background: none;
      border: none;
      cursor: pointer;
      padding: 0.3rem;
      border-radius: 6px;
      font-size: 1rem;
      transition: background 0.2s;
      line-height: 1;
    }
    .icon-btn:hover { background: rgba(255,255,255,0.1); }
    .icon-btn.delete:hover { background: rgba(233,69,96,0.2); }

    .card-desc {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.5;
      margin-bottom: 0.75rem;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
    }
    .tag {
      background: rgba(255,255,255,0.07);
      border-radius: 20px;
      padding: 0.2rem 0.7rem;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .tag.category { color: #a78bfa; background: rgba(167,139,250,0.1); }
    .tag.status-not-started { color: var(--muted); }
    .tag.status-in-progress { color: var(--warning); background: rgba(255,152,0,0.1); }
    .tag.status-completed { color: var(--success); background: rgba(76,175,80,0.1); }
    .tag.status-on-hold { color: var(--info); background: rgba(33,150,243,0.1); }

    .progress-bar {
      background: rgba(255,255,255,0.08);
      border-radius: 99px;
      height: 6px;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--accent), var(--accent3));
      transition: width 0.5s;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: var(--muted);
    }
    .empty-state .icon { font-size: 4rem; margin-bottom: 1rem; }
    .empty-state h3 { font-size: 1.2rem; margin-bottom: 0.5rem; color: var(--text); }

    /* ── Timeline ── */
    .timeline { position: relative; padding-left: 2.5rem; }
    .timeline::before {
      content: '';
      position: absolute;
      left: 0.75rem;
      top: 0; bottom: 0;
      width: 2px;
      background: linear-gradient(to bottom, var(--accent), var(--accent3), transparent);
    }
    .timeline-year {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--accent);
      margin: 2rem 0 1rem;
      padding-left: 1rem;
      position: relative;
    }
    .timeline-year::before {
      content: '';
      position: absolute;
      left: -1.75rem;
      top: 50%;
      transform: translateY(-50%);
      width: 12px; height: 12px;
      background: var(--accent);
      border-radius: 50%;
      border: 2px solid var(--bg);
    }
    .timeline-item {
      position: relative;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.1rem 1.25rem;
      margin-bottom: 1rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .timeline-item:hover { transform: translateX(4px); box-shadow: 0 4px 20px rgba(0,0,0,0.2); }
    .timeline-item::before {
      content: '';
      position: absolute;
      left: -2.15rem;
      top: 1.2rem;
      width: 10px; height: 10px;
      border-radius: 50%;
      border: 2px solid var(--bg);
    }
    .timeline-item[data-status="not-started"]::before { background: var(--muted); }
    .timeline-item[data-status="in-progress"]::before { background: var(--warning); }
    .timeline-item[data-status="completed"]::before { background: var(--success); }
    .timeline-item[data-status="on-hold"]::before { background: var(--info); }

    .timeline-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .timeline-item-title { font-weight: 600; font-size: 1rem; }
    .timeline-item-date { font-size: 0.8rem; color: var(--muted); }
    .timeline-item-desc { font-size: 0.85rem; color: var(--muted); }

    /* ── Modal ── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 560px;
      max-height: 90vh;
      overflow-y: auto;
      position: relative;
      animation: slideUp 0.25s ease;
    }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    .modal-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }
    .modal-close {
      position: absolute;
      top: 1.25rem; right: 1.25rem;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.4rem;
      cursor: pointer;
      line-height: 1;
      padding: 0.25rem;
    }
    .modal-close:hover { color: var(--text); }

    /* ── Form ── */
    .form-group { margin-bottom: 1.1rem; }
    label {
      display: block;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 0.4rem;
      font-weight: 500;
    }
    input, textarea, select {
      width: 100%;
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.7rem 1rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus, select:focus { border-color: var(--accent); }
    textarea { min-height: 90px; resize: vertical; }
    select option { background: var(--card); }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .range-group {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .range-group input[type="range"] {
      flex: 1;
      padding: 0;
      accent-color: var(--accent);
      height: auto;
    }
    .range-val {
      min-width: 2.5rem;
      text-align: center;
      font-weight: 600;
      color: var(--accent);
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 0.75rem;
      margin-top: 1.5rem;
    }
    .btn-secondary {
      background: var(--border);
      color: var(--text);
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .btn-secondary:hover { background: #3a3a5a; }

    /* ── Confirm Dialog ── */
    .confirm-modal {
      max-width: 380px;
      text-align: center;
    }
    .confirm-modal .icon { font-size: 2.5rem; margin-bottom: 0.75rem; }
    .confirm-modal p { color: var(--muted); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .confirm-actions { display: flex; gap: 0.75rem; justify-content: center; }
    .btn-danger {
      background: var(--accent);
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.95rem;
      font-weight: 600;
      transition: opacity 0.2s;
    }
    .btn-danger:hover { opacity: 0.85; }

    /* ── Toast ── */
    /* ── Budget Tab ── */
    .budget-summary {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .budget-summary-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem;
      text-align: center;
    }
    .budget-summary-card .amount {
      font-size: 1.6rem;
      font-weight: 700;
    }
    .budget-summary-card .label {
      font-size: 0.78rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-top: 0.25rem;
    }
    .budget-summary-card .amount.green { color: var(--success); }
    .budget-summary-card .amount.red { color: var(--accent); }
    .budget-summary-card .amount.blue { color: var(--info); }

    .category-budget-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .category-budget-table th {
      background: rgba(255,255,255,0.04);
      text-align: left;
      padding: 0.85rem 1rem;
      font-size: 0.8rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 600;
    }
    .category-budget-table td {
      padding: 0.85rem 1rem;
      border-top: 1px solid var(--border);
      font-size: 0.92rem;
    }
    .category-budget-table tr:hover td { background: rgba(255,255,255,0.02); }
    .category-budget-table .bar-cell { width: 30%; }
    .cat-bar-bg {
      background: rgba(255,255,255,0.06);
      border-radius: 99px;
      height: 8px;
      overflow: hidden;
    }
    .cat-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.5s;
    }
    .cat-icon {
      display: inline-block;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      text-align: center;
      line-height: 28px;
      font-size: 0.85rem;
      margin-right: 0.6rem;
      vertical-align: middle;
    }
    .table-footer td {
      font-weight: 700;
      border-top: 2px solid var(--border);
      background: rgba(255,255,255,0.02);
    }

    #toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e1e3a;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.75rem 1.5rem;
      border-radius: 10px;
      font-size: 0.9rem;
      z-index: 9999;
      transition: transform 0.3s;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      header h1 { font-size: 1.8rem; }
      .header-stats { gap: 1rem; }
      .stat { padding: 0.5rem 1rem; }
      nav { padding: 0 1rem; overflow-x: auto; }
      nav button { padding: 1rem 1rem; font-size: 0.85rem; white-space: nowrap; }
      main { padding: 1rem; }
      .form-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<header>
  <h1>✨ My Dream Plan</h1>
  <p>Turn your dreams into milestones</p>
  <div class="header-stats">
    <div class="stat">
      <div class="stat-num" id="stat-total">0</div>
      <div class="stat-label">Total Dreams</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-active">0</div>
      <div class="stat-label">In Progress</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-done">0</div>
      <div class="stat-label">Completed</div>
    </div>
    <div class="stat">
      <div class="stat-num" id="stat-budget">$0</div>
      <div class="stat-label">Total Budget</div>
    </div>
  </div>
</header>

<nav>
  <button class="active" onclick="switchTab('dreams', this)">🗂️ All Dreams</button>
  <button onclick="switchTab('timeline', this)">📅 Timeline</button>
  <button onclick="switchTab('budget', this)">💰 Budget</button>
</nav>

<main>

  <!-- Dreams Tab -->
  <div id="tab-dreams" class="tab-content active">
    <div class="top-bar">
      <span class="section-title">My Dreams & Goals</span>
      <button class="btn-primary" onclick="openAddModal()">＋ Add Dream</button>
    </div>
    <div class="filter-bar">
      <input type="text" id="search-input" placeholder="Search dreams..." oninput="renderDreams()" />
      <select id="filter-status" onchange="renderDreams()">
        <option value="">All Statuses</option>
        <option value="not-started">Not Started</option>
        <option value="in-progress">In Progress</option>
        <option value="completed">Completed</option>
        <option value="on-hold">On Hold</option>
      </select>
      <select id="filter-category" onchange="renderDreams()">
        <option value="">All Categories</option>
        <option value="Career">Career</option>
        <option value="Health">Health</option>
        <option value="Travel">Travel</option>
        <option value="Education">Education</option>
        <option value="Finance">Finance</option>
        <option value="Relationships">Relationships</option>
        <option value="Personal Growth">Personal Growth</option>
        <option value="Creativity">Creativity</option>
        <option value="Other">Other</option>
      </select>
    </div>
    <div id="dreams-grid" class="dreams-grid"></div>
  </div>

  <!-- Timeline Tab -->
  <div id="tab-timeline" class="tab-content">
    <div class="top-bar">
      <span class="section-title">Dream Timeline</span>
      <button class="btn-primary" onclick="openAddModal()">＋ Add Dream</button>
    </div>
    <div id="timeline-container" class="timeline"></div>
  </div>

  <!-- Budget Tab -->
  <div id="tab-budget" class="tab-content">
    <div class="top-bar">
      <span class="section-title">Budget Overview by Category</span>
    </div>
    <div id="budget-summary" class="budget-summary"></div>
    <div id="budget-table-container"></div>
  </div>

</main>

<!-- Add / Edit Modal -->
<div id="dream-modal" class="modal-overlay" onclick="closeModalOnOverlay(event)">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modal-title">Add New Dream</div>
    <form id="dream-form" onsubmit="saveDream(event)">
      <div class="form-group">
        <label>Dream Title *</label>
        <input type="text" id="f-title" placeholder="What's your dream?" required />
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="f-desc" placeholder="Describe your dream in detail..."></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Category</label>
          <select id="f-category">
            <option>Career</option>
            <option>Health</option>
            <option>Travel</option>
            <option>Education</option>
            <option>Finance</option>
            <option>Relationships</option>
            <option>Personal Growth</option>
            <option>Creativity</option>
            <option>Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="f-status">
            <option value="not-started">Not Started</option>
            <option value="in-progress">In Progress</option>
            <option value="completed">Completed</option>
            <option value="on-hold">On Hold</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Start Date</label>
          <input type="date" id="f-start" />
        </div>
        <div class="form-group">
          <label>Target Date</label>
          <input type="date" id="f-target" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Expected Budget ($)</label>
          <input type="number" id="f-budget" min="0" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Amount Spent ($)</label>
          <input type="number" id="f-spent" min="0" step="0.01" placeholder="0.00" />
        </div>
      </div>
      <div class="form-group">
        <label>Progress: <span id="progress-label">0%</span></label>
        <div class="range-group">
          <input type="range" id="f-progress" min="0" max="100" value="0"
            oninput="document.getElementById('progress-label').textContent = this.value + '%'" />
          <span class="range-val" id="progress-display">0%</span>
        </div>
      </div>
      <div class="form-group">
        <label>Notes / Milestones</label>
        <textarea id="f-notes" placeholder="Key steps, milestones, resources..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
        <button type="submit" class="btn-primary">Save Dream</button>
      </div>
    </form>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div id="confirm-modal" class="modal-overlay" onclick="closeConfirmOnOverlay(event)">
  <div class="modal confirm-modal">
    <div class="icon">🗑️</div>
    <div class="modal-title">Delete Dream?</div>
    <p>This will permanently remove this dream. This cannot be undone.</p>
    <div class="confirm-actions">
      <button class="btn-secondary" onclick="closeConfirm()">Cancel</button>
      <button class="btn-danger" id="confirm-delete-btn">Delete</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  // ── Data Layer ──────────────────────────────────────────
  const STORAGE_KEY = 'dreamplan_v1';

  function loadDreams() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
    catch { return []; }
  }

  function saveDreams(dreams) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(dreams));
  }

  let dreams = loadDreams();
  let editingId = null;

  // ── Tabs ────────────────────────────────────────────────
  function switchTab(name, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + name).classList.add('active');
    btn.classList.add('active');
    if (name === 'timeline') renderTimeline();
    if (name === 'budget') renderBudget();
  }

  // ── Render Cards ─────────────────────────────────────────
  function getFiltered() {
    const q = (document.getElementById('search-input')?.value || '').toLowerCase();
    const s = document.getElementById('filter-status')?.value || '';
    const c = document.getElementById('filter-category')?.value || '';
    return dreams.filter(d => {
      if (q && !d.title.toLowerCase().includes(q) && !d.desc.toLowerCase().includes(q)) return false;
      if (s && d.status !== s) return false;
      if (c && d.category !== c) return false;
      return true;
    });
  }

  function statusLabel(s) {
    return { 'not-started': 'Not Started', 'in-progress': 'In Progress',
             'completed': 'Completed', 'on-hold': 'On Hold' }[s] || s;
  }

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str + 'T00:00:00');
    return d.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function daysLeft(target) {
    if (!target) return null;
    const diff = new Date(target + 'T00:00:00') - new Date();
    const days = Math.ceil(diff / 86400000);
    if (days < 0) return `${Math.abs(days)}d overdue`;
    if (days === 0) return 'Due today!';
    return `${days}d left`;
  }

  function renderDreams() {
    const grid = document.getElementById('dreams-grid');
    const filtered = getFiltered();

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div class="icon">🌟</div>
        <h3>No dreams yet</h3>
        <p>Click "Add Dream" to start planning your future!</p>
      </div>`;
    } else {
      grid.innerHTML = filtered.map(d => `
        <div class="dream-card" data-status="${d.status}">
          <div class="card-header">
            <div class="card-title">${escHtml(d.title)}</div>
            <div class="card-actions">
              <button class="icon-btn" title="Edit" onclick="openEditModal('${d.id}')">✏️</button>
              <button class="icon-btn delete" title="Delete" onclick="confirmDelete('${d.id}')">🗑️</button>
            </div>
          </div>
          ${d.desc ? `<div class="card-desc">${escHtml(d.desc)}</div>` : ''}
          <div class="card-meta">
            <span class="tag category">${escHtml(d.category)}</span>
            <span class="tag status-${d.status}">${statusLabel(d.status)}</span>
          </div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${d.progress}%"></div>
          </div>
          ${d.budget ? `<div class="card-budget" style="display:flex;justify-content:space-between;font-size:.8rem;margin-bottom:.5rem;color:var(--muted)">
            <span>💰 Budget: $${Number(d.budget).toLocaleString()}</span>
            <span style="color:${(d.spent||0)>d.budget?'var(--accent)':'var(--success)'}">Spent: $${Number(d.spent||0).toLocaleString()}</span>
          </div>` : ''}
          <div class="card-footer">
            <span>${d.target ? '🎯 ' + formatDate(d.target) : ''}</span>
            <span>${d.target ? daysLeft(d.target) : ''}</span>
          </div>
        </div>
      `).join('');
    }

    updateStats();
  }

  // ── Render Timeline ──────────────────────────────────────
  function renderTimeline() {
    const container = document.getElementById('timeline-container');
    const sorted = [...dreams].sort((a, b) => {
      const da = a.target || a.start || '9999-12-31';
      const db = b.target || b.start || '9999-12-31';
      return da.localeCompare(db);
    });

    if (sorted.length === 0) {
      container.innerHTML = `<div class="empty-state">
        <div class="icon">📅</div>
        <h3>No dreams in the timeline</h3>
        <p>Add dreams with dates to see them here.</p>
      </div>`;
      return;
    }

    // Group by year
    const byYear = {};
    sorted.forEach(d => {
      const year = d.target ? d.target.slice(0,4) : d.start ? d.start.slice(0,4) : 'No Date';
      if (!byYear[year]) byYear[year] = [];
      byYear[year].push(d);
    });

    container.innerHTML = Object.entries(byYear).map(([year, items]) => `
      <div class="timeline-year">${year}</div>
      ${items.map(d => `
        <div class="timeline-item" data-status="${d.status}" onclick="openEditModal('${d.id}')">
          <div class="timeline-item-header">
            <span class="timeline-item-title">${escHtml(d.title)}</span>
            <span class="timeline-item-date">${formatDate(d.target || d.start)}</span>
          </div>
          <div style="display:flex;gap:.5rem;align-items:center;margin:.35rem 0">
            <span class="tag category" style="font-size:.72rem">${escHtml(d.category)}</span>
            <span class="tag status-${d.status}" style="font-size:.72rem">${statusLabel(d.status)}</span>
            <span style="font-size:.72rem;color:var(--muted);margin-left:auto">${d.progress}%</span>
          </div>
          <div class="progress-bar" style="margin-bottom:0">
            <div class="progress-fill" style="width:${d.progress}%"></div>
          </div>
          ${d.budget ? `<div style="font-size:.78rem;color:var(--muted);margin-top:.35rem">💰 Budget: $${Number(d.budget).toLocaleString()} · Spent: $${Number(d.spent||0).toLocaleString()}</div>` : ''}
          ${d.desc ? `<div class="timeline-item-desc" style="margin-top:.4rem">${escHtml(d.desc.slice(0,100))}${d.desc.length>100?'…':''}</div>` : ''}
        </div>
      `).join('')}
    `).join('');
  }

  // ── Render Budget ────────────────────────────────────────
  const categoryIcons = {
    'Career': '💼', 'Health': '🏃', 'Travel': '✈️', 'Education': '🎓',
    'Finance': '📈', 'Relationships': '❤️', 'Personal Growth': '🌱',
    'Creativity': '🎨', 'Other': '📌'
  };
  const categoryColors = {
    'Career': '#6366f1', 'Health': '#22c55e', 'Travel': '#f59e0b', 'Education': '#3b82f6',
    'Finance': '#10b981', 'Relationships': '#ec4899', 'Personal Growth': '#8b5cf6',
    'Creativity': '#f97316', 'Other': '#64748b'
  };

  function renderBudget() {
    const summaryEl = document.getElementById('budget-summary');
    const tableEl = document.getElementById('budget-table-container');

    const totalBudget = dreams.reduce((s, d) => s + (Number(d.budget) || 0), 0);
    const totalSpent = dreams.reduce((s, d) => s + (Number(d.spent) || 0), 0);
    const remaining = totalBudget - totalSpent;

    // Summary cards
    summaryEl.innerHTML = `
      <div class="budget-summary-card">
        <div class="amount blue">$${totalBudget.toLocaleString()}</div>
        <div class="label">Total Expected Budget</div>
      </div>
      <div class="budget-summary-card">
        <div class="amount ${totalSpent > totalBudget ? 'red' : 'green'}">$${totalSpent.toLocaleString()}</div>
        <div class="label">Total Spent</div>
      </div>
      <div class="budget-summary-card">
        <div class="amount ${remaining < 0 ? 'red' : 'green'}">$${Math.abs(remaining).toLocaleString()}</div>
        <div class="label">${remaining >= 0 ? 'Remaining' : 'Over Budget'}</div>
      </div>
    `;

    // Group by category
    const cats = {};
    dreams.forEach(d => {
      if (!cats[d.category]) cats[d.category] = { budget: 0, spent: 0, count: 0 };
      cats[d.category].budget += Number(d.budget) || 0;
      cats[d.category].spent += Number(d.spent) || 0;
      cats[d.category].count++;
    });

    const entries = Object.entries(cats).sort((a, b) => b[1].budget - a[1].budget);
    const maxBudget = Math.max(...entries.map(([, v]) => v.budget), 1);

    if (entries.length === 0) {
      tableEl.innerHTML = `<div class="empty-state">
        <div class="icon">💰</div>
        <h3>No budget data yet</h3>
        <p>Add dreams with budget amounts to see the breakdown here.</p>
      </div>`;
      return;
    }

    tableEl.innerHTML = `
      <table class="category-budget-table">
        <thead>
          <tr>
            <th>Category</th>
            <th>Dreams</th>
            <th>Expected Budget</th>
            <th>Amount Spent</th>
            <th>Remaining</th>
            <th class="bar-cell">Usage</th>
          </tr>
        </thead>
        <tbody>
          ${entries.map(([cat, v]) => {
            const rem = v.budget - v.spent;
            const pct = v.budget > 0 ? Math.min((v.spent / v.budget) * 100, 100) : 0;
            const overPct = v.budget > 0 && v.spent > v.budget;
            const color = categoryColors[cat] || '#64748b';
            return `<tr>
              <td>
                <span class="cat-icon" style="background:${color}22;color:${color}">${categoryIcons[cat]||'📌'}</span>
                ${escHtml(cat)}
              </td>
              <td style="text-align:center">${v.count}</td>
              <td>$${v.budget.toLocaleString()}</td>
              <td style="color:${overPct?'var(--accent)':'var(--text)'}">$${v.spent.toLocaleString()}</td>
              <td style="color:${rem<0?'var(--accent)':'var(--success)'}">
                ${rem < 0 ? '-' : ''}$${Math.abs(rem).toLocaleString()}
              </td>
              <td class="bar-cell">
                <div style="display:flex;align-items:center;gap:.5rem">
                  <div class="cat-bar-bg" style="flex:1">
                    <div class="cat-bar-fill" style="width:${pct}%;background:${overPct?'var(--accent)':color}"></div>
                  </div>
                  <span style="font-size:.75rem;color:var(--muted);min-width:2.5rem">${v.budget>0?Math.round(v.spent/v.budget*100)+'%':'—'}</span>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
        <tfoot>
          <tr class="table-footer">
            <td>Total</td>
            <td style="text-align:center">${dreams.length}</td>
            <td>$${totalBudget.toLocaleString()}</td>
            <td style="color:${totalSpent>totalBudget?'var(--accent)':'var(--text)'}">$${totalSpent.toLocaleString()}</td>
            <td style="color:${remaining<0?'var(--accent)':'var(--success)'}">
              ${remaining<0?'-':''}$${Math.abs(remaining).toLocaleString()}
            </td>
            <td class="bar-cell">
              <div style="display:flex;align-items:center;gap:.5rem">
                <div class="cat-bar-bg" style="flex:1">
                  <div class="cat-bar-fill" style="width:${totalBudget>0?Math.min(totalSpent/totalBudget*100,100):0}%;background:${totalSpent>totalBudget?'var(--accent)':'var(--info)'}"></div>
                </div>
                <span style="font-size:.75rem;color:var(--muted);min-width:2.5rem">${totalBudget>0?Math.round(totalSpent/totalBudget*100)+'%':'—'}</span>
              </div>
            </td>
          </tr>
        </tfoot>
      </table>
    `;
  }

  // ── Stats ────────────────────────────────────────────────
  function updateStats() {
    document.getElementById('stat-total').textContent = dreams.length;
    document.getElementById('stat-active').textContent = dreams.filter(d => d.status === 'in-progress').length;
    document.getElementById('stat-done').textContent = dreams.filter(d => d.status === 'completed').length;
    const totalBudget = dreams.reduce((sum, d) => sum + (Number(d.budget) || 0), 0);
    document.getElementById('stat-budget').textContent = '$' + totalBudget.toLocaleString();
  }

  // ── Modal ────────────────────────────────────────────────
  function openAddModal() {
    editingId = null;
    document.getElementById('modal-title').textContent = 'Add New Dream';
    document.getElementById('dream-form').reset();
    document.getElementById('f-progress').value = 0;
    document.getElementById('progress-label').textContent = '0%';
    document.getElementById('progress-display').textContent = '0%';
    document.getElementById('dream-modal').classList.add('open');
  }

  function openEditModal(id) {
    const d = dreams.find(x => x.id === id);
    if (!d) return;
    editingId = id;
    document.getElementById('modal-title').textContent = 'Edit Dream';
    document.getElementById('f-title').value = d.title;
    document.getElementById('f-desc').value = d.desc;
    document.getElementById('f-category').value = d.category;
    document.getElementById('f-status').value = d.status;
    document.getElementById('f-start').value = d.start;
    document.getElementById('f-target').value = d.target;
    document.getElementById('f-budget').value = d.budget || '';
    document.getElementById('f-spent').value = d.spent || '';
    document.getElementById('f-progress').value = d.progress;
    document.getElementById('progress-label').textContent = d.progress + '%';
    document.getElementById('progress-display').textContent = d.progress + '%';
    document.getElementById('f-notes').value = d.notes || '';
    document.getElementById('dream-modal').classList.add('open');
  }

  function closeModal() {
    document.getElementById('dream-modal').classList.remove('open');
  }

  function closeModalOnOverlay(e) {
    if (e.target === document.getElementById('dream-modal')) closeModal();
  }

  // ── Save Dream ───────────────────────────────────────────
  function saveDream(e) {
    e.preventDefault();
    const dream = {
      id: editingId || Date.now().toString(36) + Math.random().toString(36).slice(2),
      title: document.getElementById('f-title').value.trim(),
      desc: document.getElementById('f-desc').value.trim(),
      category: document.getElementById('f-category').value,
      status: document.getElementById('f-status').value,
      start: document.getElementById('f-start').value,
      target: document.getElementById('f-target').value,
      budget: parseFloat(document.getElementById('f-budget').value) || 0,
      spent: parseFloat(document.getElementById('f-spent').value) || 0,
      progress: parseInt(document.getElementById('f-progress').value),
      notes: document.getElementById('f-notes').value.trim(),
      updatedAt: new Date().toISOString(),
    };

    if (editingId) {
      const idx = dreams.findIndex(x => x.id === editingId);
      dreams[idx] = { ...dreams[idx], ...dream };
      showToast('Dream updated!');
    } else {
      dream.createdAt = dream.updatedAt;
      dreams.unshift(dream);
      showToast('Dream added!');
    }

    saveDreams(dreams);
    closeModal();
    renderDreams();
    if (document.getElementById('tab-timeline').classList.contains('active')) renderTimeline();
    if (document.getElementById('tab-budget').classList.contains('active')) renderBudget();
  }

  // ── Delete ───────────────────────────────────────────────
  let deleteTargetId = null;

  function confirmDelete(id) {
    deleteTargetId = id;
    document.getElementById('confirm-modal').classList.add('open');
    document.getElementById('confirm-delete-btn').onclick = () => {
      dreams = dreams.filter(x => x.id !== deleteTargetId);
      saveDreams(dreams);
      renderDreams();
      if (document.getElementById('tab-timeline').classList.contains('active')) renderTimeline();
    if (document.getElementById('tab-budget').classList.contains('active')) renderBudget();
      closeConfirm();
      showToast('Dream deleted.');
    };
  }

  function closeConfirm() {
    document.getElementById('confirm-modal').classList.remove('open');
    deleteTargetId = null;
  }

  function closeConfirmOnOverlay(e) {
    if (e.target === document.getElementById('confirm-modal')) closeConfirm();
  }

  // ── Progress slider sync ─────────────────────────────────
  document.getElementById('f-progress').addEventListener('input', function() {
    document.getElementById('progress-display').textContent = this.value + '%';
  });

  // ── Toast ────────────────────────────────────────────────
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // ── Escape HTML ──────────────────────────────────────────
  function escHtml(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // ── Keyboard ─────────────────────────────────────────────
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { closeModal(); closeConfirm(); }
  });

  // ── Init ─────────────────────────────────────────────────
  renderDreams();
</script>
</body>
</html>
